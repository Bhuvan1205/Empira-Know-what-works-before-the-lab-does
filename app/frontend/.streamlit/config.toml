# Empira theme: neutral palette taken from the logo (slate ink, sage, stone, fog).
[server]
enableStaticServing = true
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[theme]
base = "light"
primaryColor = "#4F6660"
backgroundColor = "#F4F5F3"
secondaryBackgroundColor = "#E8EBE7"
textColor = "#2B3437"
linkColor = "#4F6660"
borderColor = "#D6DAD4"
font = "Lexend, sans-serif"
headingFont = "Lexend, sans-serif"
headingFontWeights = [700, 700]
baseFontSize = 16
baseRadius = "10px"
showSidebarBorder = false
greenColor = "#5E7F67"
orangeColor = "#A3874F"
redColor = "#9E5A5A"
grayColor = "#9C9486"
greenTextColor = "#4E6E57"
orangeTextColor = "#7E6634"
redTextColor = "#8E4B4B"
greenBackgroundColor = "#E3EBE4"
orangeBackgroundColor = "#F1EADC"
redBackgroundColor = "#F2E3E2"

[theme.sidebar]
backgroundColor = "#2B3437"
secondaryBackgroundColor = "#36423F"
textColor = "#E9ECE8"
primaryColor = "#C9D3CD"
borderColor = "#3E4B48"
linkColor = "#C9D3CD"

[[theme.fontFaces]]
family = "Lexend"
url = "app/static/Lexend-Regular.ttf"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Lexend"
url = "app/static/Lexend-Bold.ttf"
weight = 700
style = "normal"
